<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Tables - Order Summary</title>
</head>
<body>
  <!-- Demonstration of semantic HTML table sections: thead, tbody, and tfoot -->
  <h1>Store Inventory &amp; Order Summary</h1>

  <table border="1" cellpadding="8" cellspacing="0">
    <thead>
      <tr>
        <th>Item</th>
        <th>Quantity</th>
        <th>Unit Price</th>
        <th>Line Total</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Wireless Keyboard</td>
        <td>2</td>
        <td>$45</td>
        <td>$90</td>
      </tr>
      <tr>
        <td>USB-C Hub</td>
        <td>3</td>
        <td>$30</td>
        <td>$90</td>
      </tr>
      <tr>
        <td>Monitor Stand</td>
        <td>1</td>
        <td>$60</td>
        <td>$60</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <th>Total</th>
        <td>6</td>
        <td>-</td>
        <th>$240</th>
      </tr>
    </tfoot>
  </table>
</body>
</html>

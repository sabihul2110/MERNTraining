<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Forecast Application</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <div class="weather-app">
      <h1>🌤️ Weather Forecast</h1>
      <p class="subtitle">Look up real-time weather conditions for any city</p>

      <div class="search-box">
        <input
          type="text"
          id="cityInput"
          placeholder="Enter a city name (e.g., London, Tokyo)"
          aria-label="City name"
        >
        <button id="searchBtn" type="button">Search</button>
      </div>

      <div id="weatherOutput">
        <p class="status-message">Enter a city name above to view current conditions 🌍</p>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
